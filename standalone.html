<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>雨落成诗 - 创意编程动效</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }
    body {
      background-color: #121314;
      font-family: "Songti SC", "Noto Serif SC", "STSong", "SimSun", serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
      color: #222;
    }
    #stage-container {
      position: relative;
      width: 100vw;
      height: 100vh;
      max-width: 1600px;
      max-height: 900px;
      aspect-ratio: 16 / 9;
      background-color: #dedcd7;
      box-shadow: 0 25px 70px rgba(0, 0, 0, 0.7);
      overflow: hidden;
    }
    canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: block;
      cursor: crosshair;
    }
    /* 顶部控制栏 */
    .top-bar {
      position: absolute;
      top: 24px;
      left: 36px;
      right: 36px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 20;
    }
    .poem-selector {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    select, input {
      background: rgba(255, 255, 255, 0.45);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid rgba(0, 0, 0, 0.15);
      border-radius: 20px;
      padding: 7px 16px;
      font-size: 13px;
      color: #2b2b2b;
      font-family: inherit;
      outline: none;
      cursor: pointer;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
      transition: all 0.2s ease;
    }
    select:hover, input:hover, input:focus {
      background: rgba(255, 255, 255, 0.75);
      border-color: rgba(0, 0, 0, 0.3);
    }
    .custom-input {
      width: 220px;
      cursor: text;
    }
    .controls {
      display: flex;
      gap: 10px;
    }
    .btn {
      background: rgba(255, 255, 255, 0.45);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid rgba(0, 0, 0, 0.15);
      border-radius: 20px;
      padding: 7px 18px;
      font-size: 12px;
      letter-spacing: 1px;
      color: #2b2b2b;
      cursor: pointer;
      font-family: inherit;
      transition: all 0.2s ease;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
    }
    .btn:hover {
      background: rgba(255, 255, 255, 0.8);
      border-color: rgba(0, 0, 0, 0.35);
    }
    /* 底部电影感状态栏 HUD */
    .hud {
      position: absolute;
      bottom: 24px;
      left: 36px;
      right: 36px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
      letter-spacing: 2px;
      color: rgba(30, 30, 30, 0.7);
      pointer-events: none;
      z-index: 10;
    }
    .hud-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .hud-icon {
      width: 14px;
      height: 14px;
      border: 1.5px solid rgba(30, 30, 30, 0.75);
      border-radius: 50%;
      display: inline-block;
      position: relative;
    }
    .hud-icon::after {
      content: "";
      position: absolute;
      top: 3px;
      left: 3px;
      right: 3px;
      bottom: 3px;
      background-color: rgba(30, 30, 30, 0.75);
      border-radius: 50%;
    }
    .hud-title {
      font-weight: 600;
      font-size: 11px;
      letter-spacing: 1.5px;
    }
    .hud-right {
      display: flex;
      align-items: center;
      gap: 16px;
      font-variant-numeric: tabular-nums;
      font-weight: 500;
    }
    .progress-bar-wrap {
      width: 120px;
      height: 3px;
      background: rgba(0, 0, 0, 0.12);
      border-radius: 2px;
      overflow: hidden;
    }
    .progress-bar {
      height: 100%;
      width: 0%;
      background: rgba(30, 30, 30, 0.7);
    }
  </style>
</head>
<body>
  <div id="stage-container">
    <canvas id="mainCanvas"></canvas>

    <!-- 顶部控制栏 -->
    <div class="top-bar">
      <div class="poem-selector">
        <select id="poemSelect">
          <option value="小楼一夜听春雨 深巷明朝卖杏花">陆游 ·《临安春雨初霁》</option>
          <option value="清明时节雨纷纷 路上行人欲断魂">杜牧 ·《清明》</option>
          <option value="好雨知时节 当春乃发生">杜甫 ·《春夜喜雨》</option>
          <option value="一蓑烟雨任平生 也无风雨也无晴">苏轼 ·《定风波》</option>
          <option value="custom">自定义诗句...</option>
        </select>
        <input type="text" id="customInput" class="custom-input" placeholder="输入自定义诗词..." style="display: none;" />
      </div>
      <div class="controls">
        <button class="btn" id="btnAudio">声音: 关</button>
        <button class="btn" id="btnReplay">重新开始 (15s)</button>
      </div>
    </div>

    <!-- 底部复刻 HUD -->
    <div class="hud">
      <div class="hud-left">
        <span class="hud-icon"></span>
        <span class="hud-title">VIBE CODING · 雨落成诗</span>
      </div>
      <div class="hud-right">
        <div class="progress-bar-wrap">
          <div class="progress-bar" id="progressBar"></div>
        </div>
        <span id="timeDisplay">▶ 00:00 / 15:00</span>
      </div>
    </div>
  </div>

  <script>
    const canvas = document.getElementById("mainCanvas");
    const ctx = canvas.getContext("2d");
    const stage = document.getElementById("stage-container");
    const timeDisplay = document.getElementById("timeDisplay");
    const progressBar = document.getElementById("progressBar");
    const btnReplay = document.getElementById("btnReplay");
    const btnAudio = document.getElementById("btnAudio");
    const poemSelect = document.getElementById("poemSelect");
    const customInput = document.getElementById("customInput");

    const BASE_W = 1600;
    const BASE_H = 900;
    let dpr = 1;

    function resize() {
      const rect = stage.getBoundingClientRect();
      dpr = window.devicePixelRatio || 1;
      canvas.width = rect.width * dpr;
      canvas.height = rect.height * dpr;
    }
    window.addEventListener("resize", resize);
    resize();

    // 乱字库
    const RANDOM_CHARS = "城船水山跳云春寒滴梧琴乱归少空街黄更点花夜风听深巷晓青帘斜池阁烟远落残微冷孤初暮客舟";

    const TOTAL_DURATION = 15.0; // 15秒循环
    let loopTime = 0;
    let lastTs = performance.now();

    let currentPoemRaw = poemSelect.value;
    let poemLines = ["小楼一夜听春雨", "深巷明朝卖杏花"];

    function updatePoemLines(text) {
      const parts = text.trim().split(/\s+/);
      if (parts.length >= 2) {
        poemLines = [parts[0], parts.slice(1).join("")];
      } else {
        const half = Math.ceil(text.length / 2);
        poemLines = [text.slice(0, half), text.slice(half)];
      }
    }
    updatePoemLines(currentPoemRaw);

    // 音频合成 (Web Audio API)
    let audioCtx = null;
    let soundEnabled = false;

    function playDripSound(freqMod = 1.0) {
      if (!soundEnabled || !audioCtx) return;
      try {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = "sine";
        const f0 = (320 + Math.random() * 260) * freqMod;
        osc.frequency.setValueAtTime(f0, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(70, audioCtx.currentTime + 0.08);

        gain.gain.setValueAtTime(0.04, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.08);

        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.09);
      } catch (e) {}
    }

    btnAudio.addEventListener("click", () => {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === "suspended") {
        audioCtx.resume();
      }
      soundEnabled = !soundEnabled;
      btnAudio.textContent = soundEnabled ? "声音: 开" : "声音: 关";
    });

    poemSelect.addEventListener("change", (e) => {
      if (e.target.value === "custom") {
        customInput.style.display = "inline-block";
        customInput.focus();
      } else {
        customInput.style.display = "none";
        updatePoemLines(e.target.value);
        resetScene();
      }
    });

    customInput.addEventListener("change", (e) => {
      if (e.target.value.trim()) {
        updatePoemLines(e.target.value);
        resetScene();
      }
    });

    btnReplay.addEventListener("click", () => {
      resetScene();
    });

    // 点击画布可触发水花互动
    canvas.addEventListener("pointerdown", (e) => {
      const rect = stage.getBoundingClientRect();
      const clickX = ((e.clientX - rect.left) / rect.width) * BASE_W;
      const clickY = ((e.clientY - rect.top) / rect.height) * BASE_H;
      for (let i = 0; i < 12; i++) {
        splashes.push(new Splash(clickX, clickY));
      }
      playDripSound(1.2);
    });

    // -------------------------------------------------------------
    // 屋檐几何模型与连续碰撞检测
    // -------------------------------------------------------------
    // 飞檐脊线控制点：左高右低，并在末端优雅上翘
    const ROOF_POINTS = [
      { x: -60,  y: 320 },
      { x: 100,  y: 375 },
      { x: 260,  y: 435 },
      { x: 440,  y: 500 },
      { x: 600,  y: 555 },
      { x: 740,  y: 595 },
      { x: 840,  y: 610 }, // 最低洼点
      { x: 915,  y: 600 }, // 翘角起点
      { x: 980,  y: 552 }, // 檐角尖端
    ];

    function getRoofInfo(x) {
      if (x < ROOF_POINTS[0].x || x > ROOF_POINTS[ROOF_POINTS.length - 1].x) {
        return null;
      }
      for (let i = 0; i < ROOF_POINTS.length - 1; i++) {
        const p1 = ROOF_POINTS[i];
        const p2 = ROOF_POINTS[i + 1];
        if (x >= p1.x && x <= p2.x) {
          const t = (x - p1.x) / (p2.x - p1.x);
          const ease = t * t * (3 - 2 * t);
          const y = p1.y + (p2.y - p1.y) * ease;
          const dydx = (p2.y - p1.y) / (p2.x - p1.x);
          return { y, dydx, index: i };
        }
      }
      return null;
    }

    // 绘制古典建筑屋檐（瓦面、滴水、椽子、斗拱与老照片墨韵）
    function drawRoof(c) {
      c.save();

      // 1. 瓦面顶缘曲线路径
      c.beginPath();
      c.moveTo(ROOF_POINTS[0].x, ROOF_POINTS[0].y);
      for (let x = ROOF_POINTS[0].x; x <= ROOF_POINTS[ROOF_POINTS.length - 1].x; x += 6) {
        const info = getRoofInfo(x);
        if (info) c.lineTo(x, info.y);
      }
      const tip = ROOF_POINTS[ROOF_POINTS.length - 1];
      c.lineTo(tip.x, tip.y);

      // 屋檐下部结构多边形
      c.lineTo(tip.x - 10, tip.y + 26);
      c.lineTo(840, 642);
      c.lineTo(600, 648);
      c.lineTo(440, 688);
      c.lineTo(300, 720);
      c.lineTo(140, 760);
      c.lineTo(-60, 800);
      c.closePath();

      // 填充黑白老照片质感渐变
      const roofGrad = c.createLinearGradient(0, 300, 500, 800);
      roofGrad.addColorStop(0, "#2c2d30");
      roofGrad.addColorStop(0.4, "#1d1e21");
      roofGrad.addColorStop(1, "#121214");
      c.fillStyle = roofGrad;
      c.fill();

      // 2. 瓦垄线条（阴阳瓦与纵向棱线）
      c.strokeStyle = "rgba(12, 12, 14, 0.85)";
      c.lineWidth = 3.5;
      c.beginPath();
      for (let i = 0; i < ROOF_POINTS.length - 1; i += 2) {
        const p = ROOF_POINTS[i];
        c.moveTo(p.x, p.y);
        c.lineTo(p.x - 28, p.y + 115);
      }
      c.stroke();

      // 3. 檐下斗拱柱头剪影
      c.fillStyle = "#18191b";
      c.fillRect(340, 550, 16, 90);
      c.fillRect(520, 590, 16, 75);
      c.fillRect(700, 622, 14, 60);

      // 4. 瓦面顶缘漫反射微光（与碰撞线 100% 重合）
      c.beginPath();
      c.moveTo(ROOF_POINTS[0].x, ROOF_POINTS[0].y);
      for (let x = ROOF_POINTS[0].x; x <= tip.x; x += 6) {
        const info = getRoofInfo(x);
        if (info) c.lineTo(x, info.y);
      }
      c.strokeStyle = "rgba(230, 230, 230, 0.35)";
      c.lineWidth = 1.5;
      c.stroke();

      // 5. 檐角戗脊小兽点缀
      c.fillStyle = "#1e1f22";
      c.beginPath();
      c.arc(tip.x - 4, tip.y - 3, 6, 0, Math.PI * 2);
      c.fill();

      c.restore();
    }

    // -------------------------------------------------------------
    // 粒子系统：雨丝、飞溅水花、乱字雨、成诗文字
    // -------------------------------------------------------------

    // 飞溅水花与墨滴
    let splashes = [];
    class Splash {
      constructor(x, y) {
        this.x = x;
        this.y = y;
        const angle = -Math.PI * 0.5 + (Math.random() - 0.5) * 1.5;
        const speed = 2.0 + Math.random() * 5.0;
        this.vx = Math.cos(angle) * speed;
        this.vy = Math.sin(angle) * speed;
        this.gravity = 0.22;
        this.life = 1.0;
        this.decay = 0.038 + Math.random() * 0.035;
        this.radius = 1.0 + Math.random() * 2.0;
      }
      update() {
        this.x += this.vx;
        this.y += this.vy;
        this.vy += this.gravity;
        this.life -= this.decay;
      }
      draw(c) {
        c.save();
        c.globalAlpha = Math.max(0, this.life * 0.7);
        c.fillStyle = "#222326";
        c.beginPath();
        c.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
        c.fill();
        c.restore();
      }
    }

    // 细雨线
    let rainDrops = [];
    class RainDrop {
      constructor() {
        this.reset();
        this.y = Math.random() * BASE_H;
      }
      reset() {
        // 大部分集中在左中侧屋檐上方，右侧大面积留白
        this.x = Math.random() * (BASE_W * 0.68) - 40;
        this.y = -20 - Math.random() * 120;
        this.length = 18 + Math.random() * 24;
        this.speed = 18 + Math.random() * 12;
        this.alpha = 0.12 + Math.random() * 0.24;
        this.slant = 1.1;
      }
      update() {
        this.x += this.slant;
        this.y += this.speed;

        const roof = getRoofInfo(this.x);
        if (roof && this.y >= roof.y) {
          if (Math.random() < 0.35) {
            splashes.push(new Splash(this.x, roof.y));
          }
          this.reset();
          return;
        }

        if (this.y > BASE_H) {
          this.reset();
        }
      }
      draw(c) {
        c.save();
        c.strokeStyle = `rgba(32, 33, 35, ${this.alpha})`;
        c.lineWidth = 1;
        c.beginPath();
        c.moveTo(this.x, this.y);
        c.lineTo(this.x - this.slant * 2, this.y - this.length);
        c.stroke();
        c.restore();
      }
    }

    // 乱字雨粒子
    let randomChars = [];
    class RandomChar {
      constructor() {
        this.reset();
        this.y = Math.random() * (BASE_H * 0.65);
      }
      reset() {
        this.char = RANDOM_CHARS[Math.floor(Math.random() * RANDOM_CHARS.length)];
        // 集中在屋檐上方区域
        this.x0 = 30 + Math.random() * (BASE_W * 0.58);
        this.x = this.x0;
        this.y = -40 - Math.random() * 260;
        this.speed = 2.2 + Math.random() * 3.4;
        this.size = 14 + Math.random() * 16;
        this.alpha = 0.22 + Math.random() * 0.42;
        this.wobbleFreq = 1.5 + Math.random() * 2.2;
        this.wobbleAmp = 4 + Math.random() * 10;
        this.rotSpeed = (Math.random() - 0.5) * 0.025;
        this.rotation = (Math.random() - 0.5) * 0.25;
      }
      update(t) {
        this.y += this.speed;
        this.x = this.x0 + Math.sin(t * this.wobbleFreq + this.y * 0.012) * this.wobbleAmp;
        this.rotation += this.rotSpeed;

        // 碰撞屋檐检测
        const roof = getRoofInfo(this.x);
        if (roof && this.y >= roof.y - 4) {
          const count = 3 + Math.floor(Math.random() * 4);
          for (let i = 0; i < count; i++) {
            splashes.push(new Splash(this.x, roof.y));
          }
          playDripSound(0.9);
          this.reset();
          return;
        }

        if (this.y > BASE_H + 50) {
          this.reset();
        }
      }
      draw(c) {
        c.save();
        c.translate(this.x, this.y);
        c.rotate(this.rotation);
        c.font = `300 ${this.size}px "Songti SC", "Noto Serif SC", serif`;
        c.fillStyle = `rgba(32, 33, 35, ${this.alpha})`;
        c.textAlign = "center";
        c.textBaseline = "middle";
        c.fillText(this.char, 0, 0);
        c.restore();
      }
    }

    // 诗句文字（留檐滑落，形成诗句）
    let poemChars = [];
    class PoemParticle {
      constructor(char, lineIndex, charIndex, totalInLine, globalIndex) {
        this.char = char;
        this.lineIndex = lineIndex;
        this.charIndex = charIndex;
        this.totalInLine = totalInLine;
        this.globalIndex = globalIndex;
        this.reset();
      }
      reset() {
        this.state = "FALLING"; // FALLING -> SLIDING -> DRIFTING
        // 错落生成时间（15秒周期内节奏）
        this.spawnTime = 1.0 + this.globalIndex * 0.65;

        // 落点错落分布在屋檐左前段，带自然微抖动（落檐时不强行排齐）
        const targetX = 110 + this.globalIndex * 40 + (Math.random() - 0.5) * 28;
        this.x0 = targetX;
        this.x = this.x0;
        this.y = -60 - (this.globalIndex % 4) * 25;
        this.speed = 3.6;
        this.size = 29;
        this.rotation = (Math.random() - 0.5) * 0.12;
        this.alpha = 0;
        this.targetAlpha = 0.92;

        // 沿瓦面滑行动力学
        this.slideVx = 0;
        this.slideOffset = (Math.random() - 0.5) * 5; // 瓦面微错位

        // 右侧留白归位目标（双行诗句对齐但带自然留白美感）
        this.driftTargetX = 1060 + this.charIndex * 48;
        this.driftTargetY = 380 + this.lineIndex * 70 + (Math.random() - 0.5) * 4;
        this.driftSpeed = 2.4;
      }
      update(t, dt) {
        if (t < this.spawnTime) return;

        if (this.state === "FALLING") {
          this.alpha = Math.min(this.targetAlpha, this.alpha + 0.05);
          this.y += this.speed;
          this.x = this.x0 + Math.sin(t * 2.2 + this.globalIndex) * 5;
          this.rotation = Math.sin(t * 1.6) * 0.08;

          // 撞击屋檐
          const roof = getRoofInfo(this.x);
          if (roof && this.y >= roof.y - 8) {
            this.state = "SLIDING";
            this.y = roof.y - 6;
            this.slideVx = 1.5;
            for (let i = 0; i < 5; i++) {
              splashes.push(new Splash(this.x, roof.y));
            }
            playDripSound(1.1);
          }
        } else if (this.state === "SLIDING") {
          const roof = getRoofInfo(this.x);
          if (roof) {
            // 切向加速度
            const slopeAccel = Math.max(0.04, roof.dydx * 0.18);
            this.slideVx += slopeAccel;
            this.slideVx = Math.min(this.slideVx, 4.4);
            this.x += this.slideVx;

            const nextRoof = getRoofInfo(this.x);
            if (nextRoof) {
              this.y = nextRoof.y - 6 + this.slideOffset;
              this.rotation = Math.atan(nextRoof.dydx) * 0.55;
            } else {
              this.state = "DRIFTING";
            }
          } else {
            this.state = "DRIFTING";
          }
        } else if (this.state === "DRIFTING") {
          // 顺势飞向右侧留白处，自然吸附成行
          const dx = this.driftTargetX - this.x;
          const dy = this.driftTargetY - this.y;
          this.x += dx * 0.038;
          this.y += dy * 0.038;
          this.rotation *= 0.94; // 逐渐恢复端正

          // 15秒循环末期缓缓淡出消融
          if (t > TOTAL_DURATION - 1.8) {
            this.alpha = Math.max(0, this.alpha - 0.035);
          }
        }
      }
      draw(c) {
        if (this.alpha <= 0) return;
        c.save();
        c.translate(this.x, this.y);
        c.rotate(this.rotation);

        // 浓墨宋体质感
        c.font = `600 ${this.size}px "Songti SC", "Noto Serif SC", "STSong", serif`;
        c.fillStyle = `rgba(16, 17, 19, ${this.alpha})`;
        c.textAlign = "center";
        c.textBaseline = "middle";

        // 柔和水墨晕染阴影
        c.shadowColor = "rgba(0, 0, 0, 0.22)";
        c.shadowBlur = 4;
        c.fillText(this.char, 0, 0);

        // 滑动时微弱水珠光点
        if (this.state === "SLIDING") {
          c.fillStyle = "rgba(255, 255, 255, 0.4)";
          c.beginPath();
          c.arc(0, this.size * 0.4, 2, 0, Math.PI * 2);
          c.fill();
        }

        c.restore();
      }
    }

    // 重置动效
    function resetScene() {
      loopTime = 0;
      splashes = [];
      rainDrops = [];
      for (let i = 0; i < 95; i++) {
        rainDrops.push(new RainDrop());
      }
      randomChars = [];
      for (let i = 0; i < 48; i++) {
        randomChars.push(new RandomChar());
      }
      poemChars = [];
      let gIdx = 0;
      poemLines.forEach((line, lIdx) => {
        const chars = line.split("");
        chars.forEach((ch, cIdx) => {
          poemChars.push(new PoemParticle(ch, lIdx, cIdx, chars.length, gIdx));
          gIdx++;
        });
      });
    }

    resetScene();

    // 绘制水墨宣纸与阴翳老照片背景
    function drawAtmosphere(c) {
      // 1. 底层米灰暖宣纸
      const bgGrad = c.createLinearGradient(0, 0, BASE_W, BASE_H);
      bgGrad.addColorStop(0, "#d5d3ce");
      bgGrad.addColorStop(0.5, "#dedcd7");
      bgGrad.addColorStop(1, "#eae8e4");
      c.fillStyle = bgGrad;
      c.fillRect(0, 0, BASE_W, BASE_H);

      // 2. 左上角阴沉雨云水汽
      const mistGrad = c.createRadialGradient(240, 220, 40, 420, 320, 750);
      mistGrad.addColorStop(0, "rgba(85, 90, 95, 0.18)");
      mistGrad.addColorStop(1, "rgba(255, 255, 255, 0)");
      c.fillStyle = mistGrad;
      c.fillRect(0, 0, BASE_W, BASE_H);

      // 3. 右侧大面积留白区域的极简空境过渡
      const blankGrad = c.createLinearGradient(BASE_W * 0.54, 0, BASE_W, 0);
      blankGrad.addColorStop(0, "rgba(234, 232, 228, 0)");
      blankGrad.addColorStop(1, "rgba(234, 232, 228, 0.8)");
      c.fillStyle = blankGrad;
      c.fillRect(BASE_W * 0.54, 0, BASE_W * 0.46, BASE_H);
    }

    // 主渲染循环
    function tick(ts) {
      const dt = Math.min((ts - lastTs) / 1000, 0.1);
      lastTs = ts;

      loopTime += dt;
      if (loopTime >= TOTAL_DURATION) {
        resetScene();
      }

      // 更新 HUD 时间码与进度条
      const curSec = Math.floor(loopTime);
      const curMilli = Math.floor((loopTime % 1) * 100);
      const strSec = String(curSec).padStart(2, "0");
      const strMil = String(curMilli).padStart(2, "0");
      timeDisplay.textContent = `▶ ${strSec}:${strMil} / 15:00`;
      progressBar.style.width = `${(loopTime / TOTAL_DURATION) * 100}%`;

      // 视口缩放与适配
      const rect = stage.getBoundingClientRect();
      const currentScaleX = (rect.width * dpr) / BASE_W;
      const currentScaleY = (rect.height * dpr) / BASE_H;

      ctx.save();
      ctx.scale(currentScaleX, currentScaleY);

      // 1. 背景氛围渲染
      drawAtmosphere(ctx);

      // 2. 细雨丝更新与绘制
      for (let r of rainDrops) {
        r.update();
        r.draw(ctx);
      }

      // 3. 乱字雨下落
      for (let rc of randomChars) {
        rc.update(loopTime);
        rc.draw(ctx);
      }

      // 4. 水花飞溅更新与绘制
      for (let i = splashes.length - 1; i >= 0; i--) {
        const s = splashes[i];
        s.update();
        s.draw(ctx);
        if (s.life <= 0) {
          splashes.splice(i, 1);
        }
      }

      // 5. 黑白老照片屋檐
      drawRoof(ctx);

      // 6. 诗句字符（触檐、滑落、右侧留白成诗）
      for (let p of poemChars) {
        p.update(loopTime, dt);
        p.draw(ctx);
      }

      ctx.restore();

      requestAnimationFrame(tick);
    }

    requestAnimationFrame(tick);
  </script>
</body>
</html>
